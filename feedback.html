<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XENA Feedback</title><style>body{margin:0;min-height:100vh;background:#05060a;color:#f5f7ff;font:16px system-ui;display:grid;place-items:center}.box{width:min(680px,90vw);padding:28px;border:1px solid #32e6ef;border-radius:18px;background:#0c0f18}textarea{width:100%;min-height:220px;box-sizing:border-box;background:#05060a;color:#fff;border:1px solid #ffffff33;border-radius:10px;padding:12px}button{margin-top:14px;padding:12px 20px;border:0;border-radius:22px;background:#b7ff3c;font-weight:800;cursor:pointer}</style></head>
<body><main class="box"><h1>불편 접수 / Feedback</h1><p>오류, 버그, 불편사항을 알려주세요. (최대 2,000자)</p><textarea id="feedback" maxlength="2000" placeholder="내용을 입력하세요"></textarea><br><button id="send">접수하기</button><a href="games/" style="margin-left:16px;color:#32e6ef">XENA GAMES</a><p id="status"></p></main>
<script src="game/firebase-config.js"></script><script src="game/cloud-sync.js"></script><script src="games/shared-wallet.js"></script><script>document.getElementById('send').onclick=function(){var text=document.getElementById('feedback').value.trim(),s=document.getElementById('status');if(!text){s.textContent='내용을 입력하세요.';return;}this.disabled=true;window.XenaWallet.submitFeedback(text,'general',navigator.language).then(function(){s.textContent='접수되었습니다. 감사합니다.';document.getElementById('feedback').value='';}).catch(function(){s.textContent='로그인 후 다시 시도해주세요.';}).finally(()=>document.getElementById('send').disabled=false);};</script></body></html>
