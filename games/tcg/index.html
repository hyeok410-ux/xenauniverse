<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XENA: SIGNAL WARFARE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="bgm" loop preload="none"></audio>
  <div id="xena-tcg-container">
    <main id="app">
      <section id="lobby" class="screen">
        <div class="title-plate"><p class="eyebrow">XENA GAMES // PVE PROTOCOL</p><h1>XENA</h1><h2>SIGNAL WARFARE</h2></div>
        <div class="economy">XC BALANCE: <span id="xc-display">CONNECTING…</span></div>
        <div class="lobby-actions"><button id="my-cards-button" class="btn-gold">MY CARDS</button><button id="refresh-balance" class="btn-ghost">REFRESH XC</button></div>
        <div class="difficulty-grid"><p>SELECT AI DIFFICULTY</p><button data-difficulty="easy" class="difficulty">EASY</button><button data-difficulty="normal" class="difficulty selected">NORMAL</button><button data-difficulty="hard" class="difficulty">HARD</button></div>
        <button id="start-pve" class="btn-neon">START PVE BATTLE</button><p id="lobby-status" role="status"></p>
      </section>
      <section id="cards-view" class="screen" hidden>
        <div class="panel"><h2>MY CARDS</h2><p>Select exactly 15 owned cards for your battle deck.</p><p><span id="deck-count">0</span> / 15</p><div class="panel-actions"><button id="save-deck" class="btn-neon">구성 완료</button><button id="cards-back" class="btn-ghost">로비로</button></div><div id="card-list" class="card-grid"></div><p id="deck-status" role="status"></p></div>
      </section>
      <section id="battle-view" class="screen" hidden>
        <div class="battle-top"><span id="difficulty-label"></span><span id="battle-status"></span><span id="bgm-status"></span></div>
        <div class="core-row"><div id="ai-core" class="core ai">AI CORE: 30</div><div id="player-core" class="core player">YOUR CORE: 30</div></div>
        <div id="battlefield"><div><p>AI FIELD</p><div id="ai-field" class="zone"></div></div><div><p>YOUR FIELD</p><div id="player-field" class="zone"></div></div></div>
        <div id="hand" class="hand"></div>
        <div class="phase-controls"><span id="phase-label">YOUR TURN</span><button id="end-turn" class="btn-neon">END TURN</button><button id="battle-exit" class="btn-ghost">QUIT</button></div>
      </section>
    </main>
  </div>
  <!-- Main XENA Firebase/auth/economy/card ecosystem. shared-auth.js is represented by xena-auth.js in this repository. -->
  <script src="../../game/firebase-config.js?v=20260722"></script>
  <script src="../../game/cloud-sync.js?v=20260722"></script>
  <script src="../shared-identity.js?v=20260722"></script>
  <script src="../shared-gate.js?v=20260722"></script>
  <script src="../../shared/xena-auth.js?v=20260726"></script>
  <script src="../shared-audio.js?v=20260724"></script>
  <script src="../shared-wallet.js?v=20260722"></script>
  <script src="../gacha/cards.js?v=20260723"></script>
  <script src="../../shared/xena-cards.js?v=20260723"></script>
  <script src="client.js?v=20260726"></script>
  <script>if (window.XenaAudio) window.XenaAudio.init('tcg'); if (window.XenaWallet) window.XenaWallet.initEnergyUI('signal_clash');</script>
</body>
</html>
